services:
  runtime:
    build:
      context: .
      target: runtime
    environment:
      CODEACT_ENVIRONMENT: ${CODEACT_ENVIRONMENT:-development}
      CODEACT_MAX_STEPS: ${CODEACT_MAX_STEPS:-10}
      CODEACT_MAX_CONSECUTIVE_FAILURES: ${CODEACT_MAX_CONSECUTIVE_FAILURES:-3}
      CODEACT_EXECUTION_TIMEOUT_SECONDS: ${CODEACT_EXECUTION_TIMEOUT_SECONDS:-30}
      CODEACT_MAX_OUTPUT_CHARS: ${CODEACT_MAX_OUTPUT_CHARS:-12000}

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    command:
      - pytest
      - --cov=codeact
      - --cov-report=term-missing
      - --cov-fail-under=90
      - -o
      - cache_dir=/tmp/pytest_cache
