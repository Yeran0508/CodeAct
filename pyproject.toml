[build-system]
requires = ["setuptools>=75.8,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "codeact-runtime"
version = "0.5.0"
description = "A safety-first execution runtime for code-action agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "ruff==0.11.8",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = ["integration: requires Docker"]

[tool.coverage.run]
source = ["codeact"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
